<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#000000">

    <title>House of APEX</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main id="experience">

        <div id="scene-container"></div>

        <header class="top-bar">
            <div class="brand">APEX<span>.</span></div>

            <div class="status">SYSTEM / 001</div>
        </header>

        <section class="center-message" id="center-message">
            <span class="eyebrow">
                EXPERIMENTAL DRIVING EXPERIENCE
            </span>

            <h1>NO DESTINATION.</h1>

            <p>ONLY MOMENTUM.</p>
        </section>

        <footer class="bottom-bar">
            <div class="instructions" id="instructions">
                MOVE YOUR CURSOR TO DRIVE
            </div>

            <div class="launch-prompt" id="launch-prompt">
                PRESS SPACE TO LAUNCH
            </div>
        </footer>

        <div class="signal-lost" id="signal-lost">
            SIGNAL LOST
        </div>

        <div class="loading" id="loading">
            INITIALIZING SYSTEM<span>...</span>
        </div>

        <section class="intro-progress" id="intro-progress" aria-label="Experience progress" aria-live="polite">
            <div class="progress-meta">
                <span id="progress-label">AWAITING INPUT</span>
                <span id="progress-value">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </section>

        <section class="welcome-screen" id="welcome-screen" aria-label="Welcome to the Creator's Den">
            <h1 id="welcome-title"></h1>
            <div class="welcome-subtitle">APEX / CREATOR ACCESS</div>
        </section>

    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
